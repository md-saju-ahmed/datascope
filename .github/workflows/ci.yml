name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts and database packages
        run: pnpm --filter @datascope/contracts build && pnpm --filter @datascope/db build

      - name: Lint check
        run: pnpm lint

      - name: Code formatting check
        run: pnpm format:check

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  integration:
    name: PostgreSQL Integration & API Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize test environment configuration
        run: pnpm env:init

      - name: Build contracts and database packages
        run: pnpm --filter @datascope/contracts build && pnpm --filter @datascope/db build

      - name: Start isolated PostgreSQL test service
        run: pnpm db:test:up

      - name: Install PostgreSQL extensions on test database
        run: pnpm db:extensions:test

      - name: Apply schema migrations to test database
        run: pnpm db:migrate:test

      - name: Run PostgreSQL integration and Supertest API suites
        run: pnpm test:integration

      - name: Tear down test database containers
        if: always()
        run: docker compose --profile test down -v

  build:
    name: Application Builds & Production Docker Images
    runs-on: ubuntu-latest
    needs: [quality, integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application packages
        run: pnpm build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API production Docker image
        run: docker build -f apps/api/Dockerfile -t datascope-api:${{ github.sha }} .

      - name: Build Web production Docker image
        run: docker build -f apps/web/Dockerfile -t datascope-web:${{ github.sha }} .

  deploy:
    name: Production Deployment (Vercel + Render)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy web to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npm install -g vercel@latest
            vercel --prod --token "$VERCEL_TOKEN" --yes
          else
            echo "VERCEL_TOKEN not configured in GitHub Secrets — Vercel Git integration manages deployment automatically."
          fi

      - name: Trigger Render API deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -sS --fail -X POST "$RENDER_DEPLOY_HOOK_URL" \
              -H "Content-Type: application/json" \
              --max-time 30 \
              -o /dev/null
            echo "Render deploy hook triggered — build will proceed on Render."
          else
            echo "RENDER_DEPLOY_HOOK_URL not configured in GitHub Secrets — Render Git integration manages deployment automatically."
          fi

      - name: Verify deployment readiness
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://datascope-api-oa5d.onrender.com' }}
          WEB_BASE_URL: ${{ vars.PRODUCTION_URL || 'https://datascope-zhwd.vercel.app' }}
        run: |
          echo "Verifying live deployment endpoints …"
          node scripts/smoke-deployment.mjs
